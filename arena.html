<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaithChess — Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  main { padding: 0; }

  .arena-wrap {
    display: flex;
    min-height: calc(100vh - 64px);
  }

  /* ── List panel ── */
  .arena-list-panel {
    width: 300px;
    flex-shrink: 0;
    background: linear-gradient(180deg, var(--bg2), var(--bg3));
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .arena-list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .arena-list-title { font-size: 16px; font-weight: 700; color: var(--text2); }

  .btn-create {
    padding: 7px 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-create:hover { opacity: .85; }

  .tournament-list {
    overflow-y: auto;
    flex: 1;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .t-card {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg4);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: inherit;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .t-card:hover, .t-card.selected { border-color: var(--accent); background: rgba(165,148,192,.08); }
  .t-card-name  { font-size: 14px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
  .t-card-meta  { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .t-card-info  { font-size: 11px; color: var(--muted); }

  .status-badge {
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    padding: 2px 7px; border-radius: 20px; text-transform: uppercase;
  }
  .status-badge.waiting  { background: rgba(165,148,192,.15); color: var(--accent); border: 1px solid rgba(165,148,192,.3); }
  .status-badge.active   { background: rgba(76,175,125,.15);  color: #4caf7d;       border: 1px solid rgba(76,175,125,.3); }
  .status-badge.finished { background: rgba(99,95,88,.15);    color: var(--muted);  border: 1px solid var(--border); }

  /* ── Detail panel ── */
  .arena-detail-panel {
    flex: 1;
    overflow-y: auto;
    padding: 32px 36px;
  }

  .detail-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 400px;
    color: var(--muted);
    gap: 12px;
  }
  .detail-placeholder-icon { font-size: 48px; }
  .detail-placeholder-text { font-size: 14px; }

  .detail-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
  }

  .detail-title  { font-size: 26px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
  .detail-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .detail-badge  {
    font-size: 11px; color: var(--muted);
    background: var(--bg4); border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 20px;
  }

  .detail-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-action {
    padding: 10px 20px;
    border: none; border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn-action:hover          { opacity: .85; }
  .btn-action:active         { transform: scale(.97); }
  .btn-action:disabled       { opacity: .4; cursor: not-allowed; }
  .btn-action.primary        { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-action.danger         { background: rgba(224,92,92,.15); color: #e05c5c; border: 1px solid rgba(224,92,92,.3); }
  .btn-action.secondary      { background: var(--bg4); color: var(--text2); border: 1px solid var(--border); }
  .btn-action.success        { background: rgba(76,175,125,.15); color: #4caf7d; border: 1px solid rgba(76,175,125,.3); }

  /* ── Countdown ── */
  .countdown-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .countdown-label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .countdown-time  { font-size: 22px; font-weight: 700; color: var(--text2); font-variant-numeric: tabular-nums; }
  .countdown-time.low { color: #e05c5c; }

  /* ── Queue status ── */
  .queue-status-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .queue-status-bar.searching {
    color: #4caf7d;
    border-color: rgba(76,175,125,.3);
    background: rgba(76,175,125,.06);
    animation: pulse-text 1.5s infinite;
  }
  @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  /* ── Player join list ── */
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px;
  }

  .player-join-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
  .player-join-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    background: var(--bg4); border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; color: var(--text2);
  }
  .player-join-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
  }

  /* ── Leaderboard ── */
  .leaderboard-scroll { max-width: 100%; overflow-x: auto; }
  .leaderboard { width: 100%; border-collapse: collapse; }
  .leaderboard th {
    text-align: left; font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .7px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  .leaderboard td {
    padding: 10px 12px; font-size: 13px; color: var(--text2);
    border-bottom: 1px solid rgba(255,255,255,.03);
  }
  .leaderboard tr:hover td { background: rgba(255,255,255,.02); }
  .lb-rank         { font-weight: 700; color: var(--muted); width: 40px; }
  .lb-rank.gold    { color: #f0c040; }
  .lb-rank.silver  { color: #aaaaaa; }
  .lb-rank.bronze  { color: #d4956a; }
  .lb-score        { font-weight: 700; color: var(--accent); font-size: 15px; }
  .lb-you          { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .lb-wdl          { color: var(--muted); font-size: 12px; }

  /* ── Create modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.hidden { display: none; }

  .modal-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 32px;
    min-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .modal-title    { font-size: 18px; font-weight: 700; color: var(--text2); }

  .form-group     { display: flex; flex-direction: column; gap: 6px; }
  .form-label     { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .form-input, .form-select {
    padding: 10px 12px;
    background: var(--bg4); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text2);
    font-family: 'Outfit', sans-serif; font-size: 14px;
    outline: none; transition: border-color .15s;
  }
  .form-input:focus, .form-select:focus { border-color: var(--accent); }
  .form-select option { background: var(--bg3); }

  .create-error { min-height: 17px; color: #e05c5c; font-size: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .empty-list { text-align: center; color: var(--muted); font-size: 13px; padding: 32px 16px; }

  .t-card:focus-visible,
  .btn-create:focus-visible,
  .btn-action:focus-visible,
  .form-input:focus-visible,
  .form-select:focus-visible {
    outline: 3px solid var(--accent2);
    outline-offset: 2px;
  }

  @media (max-width: 850px) {
    .arena-wrap {
      min-width: 0;
      min-height: calc(100vh - 112px);
      flex-direction: column;
    }
    .arena-list-panel {
      width: 100%;
      min-width: 0;
      border-right: none;
      border-bottom: 1px solid var(--border);
      overflow: visible;
    }
    .arena-list-header { padding: 14px 16px 10px; }
    .tournament-list {
      max-width: 100%;
      flex: none;
      grid-auto-columns: minmax(230px, 80vw);
      grid-auto-flow: column;
      display: grid;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x proximity;
    }
    .t-card { min-width: 0; scroll-snap-align: start; }
    .arena-detail-panel {
      width: 100%;
      min-width: 0;
      padding: 24px 18px;
      overflow: visible;
    }
    .detail-placeholder { min-height: 260px; }
    .detail-header { flex-direction: column; }
    .detail-actions { width: 100%; flex-wrap: wrap; }
    .detail-actions .btn-action { flex: 1 1 150px; }
  }

  @media (max-width: 480px) {
    .arena-list-header { padding-inline: 12px; }
    .arena-detail-panel { padding: 20px 12px; }
    .detail-title { font-size: 22px; overflow-wrap: anywhere; }
    .countdown-bar { padding: 12px 14px; }
    .modal-overlay { padding: 12px; }
    .modal-box {
      width: 100%;
      min-width: 0;
      max-height: calc(100vh - 24px);
      padding: 22px 18px;
      overflow-y: auto;
    }
    .modal-actions { flex-direction: column-reverse; }
    .modal-actions .btn-action { width: 100%; }
  }
</style>
</head>
<body>
<header></header>

<main>
  <div class="arena-wrap">

    <!-- Left: tournament list -->
    <div class="arena-list-panel">
      <div class="arena-list-header">
        <span class="arena-list-title">♟ Arena</span>
        <button class="btn-create" id="createBtn" type="button">+ Create</button>
      </div>
      <div class="tournament-list" id="tournamentList">
        <div class="empty-list">Loading...</div>
      </div>
    </div>

    <!-- Right: detail -->
    <div class="arena-detail-panel" id="detailPanel">
      <div class="detail-placeholder">
        <div class="detail-placeholder-icon">♟</div>
        <div class="detail-placeholder-text">Select a tournament to view details</div>
      </div>
    </div>

  </div>
</main>

<!-- Create modal -->
<div class="modal-overlay hidden" id="createModal" aria-hidden="true">
  <form class="modal-box" id="createForm" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
    <h2 class="modal-title" id="createModalTitle">Create Arena Tournament</h2>
    <div class="form-group">
      <label class="form-label" for="tName">Name</label>
      <input class="form-input" id="tName" name="tournamentName" placeholder="e.g. Sunday Blitz Arena" maxlength="40" autocomplete="off" required />
    </div>
    <div class="form-group">
      <label class="form-label" for="tTc">Time Control</label>
      <select class="form-select" id="tTc" name="timeControl">
        <option value="bullet">Bullet (1+0)</option>
        <option value="blitz" selected>Blitz (5+0)</option>
        <option value="rapid">Rapid (10+0)</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="tDuration">Duration</label>
      <select class="form-select" id="tDuration" name="duration">
        <option value="15">15 minutes</option>
        <option value="30" selected>30 minutes</option>
        <option value="60">1 hour</option>
      </select>
    </div>
    <div class="create-error" id="createError" role="alert" aria-live="polite"></div>
    <div class="modal-actions">
      <button class="btn-action secondary" id="createCancelBtn" type="button">Cancel</button>
      <button class="btn-action primary" id="createSubmitBtn" type="submit">Create</button>
    </div>
  </form>
</div>

<script src="nav.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="challenges.js"></script>
<script src="settings.js"></script>

<script type="module">
  import { getDatabase, ref, get, set, update, push, onValue, runTransaction, remove, onDisconnect }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { initializeApp, getApps }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAUdXVlmN9xhhIzubK0MTtGO3hA9JkHClA",
    authDomain: "faithchess.firebaseapp.com",
    databaseURL: "https://faithchess-default-rtdb.firebaseio.com",
    projectId: "faithchess",
    storageBucket: "faithchess.firebasestorage.app",
    messagingSenderId: "132292001988",
    appId: "1:132292001988:web:3c9b7227f1b09766b48991"
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const auth = getAuth(app);

  const TC_LABELS = { bullet: "Bullet · 1+0", blitz: "Blitz · 5+0", rapid: "Rapid · 10+0" };
  const TC_SECS   = { bullet: 60, blitz: 300, rapid: 600 };
  const VALID_STATUSES = new Set(["waiting", "active", "finished"]);
  const SAFE_FIREBASE_KEY = /^[A-Za-z0-9_-]{1,128}$/;

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    })[char]);
  }

  function safeStatus(value) {
    return VALID_STATUSES.has(value) ? value : "finished";
  }

  function safeTimeControl(value) {
    return Object.hasOwn(TC_LABELS, value) ? value : "rapid";
  }

  function safeNumber(value, fallback = 0) {
    const number = Number(value);
    return Number.isFinite(number) ? Math.max(0, Math.trunc(number)) : fallback;
  }

  function safeFirebaseKey(value) {
    const key = String(value ?? "");
    return SAFE_FIREBASE_KEY.test(key) ? key : null;
  }

  let myUid      = null;
  let myUsername = null;

  let selectedId       = null;
  let detailUnsub      = null;
  let countdownInterval = null;
  let myQueueRef       = null;
  let isSearching      = false;
  let matchUnsub       = null;

  // ── Auth ──────────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "login.html"; return; }
    const snap = await get(ref(db, `users/${user.uid}/username`));
    myUid      = user.uid;
    myUsername = snap.val() || user.email;
    loadList();
  });

  // ── Tournament list ───────────────────────────────────────────────────────
  function loadList() {
    onValue(ref(db, "tournaments"), snap => {
      const listEl = document.getElementById("tournamentList");
      const data   = snap.val();

      if (!data) {
        listEl.innerHTML = `<div class="empty-list">No tournaments yet.<br>Create one to get started!</div>`;
        return;
      }

      const ORDER = { active: 0, waiting: 1, finished: 2 };
      const items  = Object.entries(data)
        .map(([id, t]) => ({
          id,
          ...(t && typeof t === "object" ? t : {}),
          status: safeStatus(t?.status),
        }))
        .sort((a, b) => (ORDER[a.status] ?? 3) - (ORDER[b.status] ?? 3)
                     || safeNumber(b.createdAt) - safeNumber(a.createdAt));

      listEl.innerHTML = "";
      for (const t of items) {
        const count = t.players ? Object.keys(t.players).length : 0;
        const duration = safeNumber(t.durationMinutes);
        const timeControl = safeTimeControl(t.timeControl);
        const card  = document.createElement("button");
        card.type = "button";
        card.className  = `t-card${t.id === selectedId ? " selected" : ""}`;
        card.dataset.id = t.id;
        card.setAttribute("aria-pressed", String(t.id === selectedId));
        card.innerHTML  = `
          <div class="t-card-name">${escapeHTML(t.name || "Arena")}</div>
          <div class="t-card-meta">
            <span class="status-badge ${t.status}">${t.status}</span>
            <span class="t-card-info">${escapeHTML(TC_LABELS[timeControl])} · ${duration}min · ${safeNumber(count)}p</span>
          </div>
        `;
        card.onclick = () => selectTournament(t.id);
        listEl.appendChild(card);
      }
    });
  }

  // ── Select ────────────────────────────────────────────────────────────────
  function selectTournament(id) {
    if (detailUnsub) { detailUnsub(); detailUnsub = null; }
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

    selectedId = id;
    document.querySelectorAll(".t-card").forEach(c => {
      const selected = c.dataset.id === id;
      c.classList.toggle("selected", selected);
      c.setAttribute("aria-pressed", String(selected));
    });

    detailUnsub = onValue(ref(db, `tournaments/${id}`), snap => {
      const t = snap.val();
      if (t) renderDetail(id, t);
    });
  }

  // ── Render detail ─────────────────────────────────────────────────────────
  function renderDetail(id, t) {
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

    const players    = t.players ? Object.entries(t.players).map(([uid, p]) => ({ uid, ...p })) : [];
    const status     = safeStatus(t.status);
    const timeControl = safeTimeControl(t.timeControl);
    const duration   = safeNumber(t.durationMinutes);
    const endAt      = safeNumber(t.endAt);
    const isJoined   = players.some(p => p.uid === myUid);
    const isCreator  = t.createdBy === myUid;
    const count      = players.length;
    const searching  = isSearching && selectedId === id;

    // ── Actions ──
    let actionsHTML = "";
    if (status === "waiting") {
      if (!isJoined) {
        actionsHTML = `<button class="btn-action primary" id="joinBtn">Join</button>`;
      } else if (isCreator) {
        actionsHTML = `
          <button class="btn-action success" id="startBtn">Start</button>
          <button class="btn-action danger"  id="leaveBtn">Leave</button>
        `;
      } else {
        actionsHTML = `<button class="btn-action danger" id="leaveBtn">Leave</button>`;
      }
    } else if (status === "active") {
      if (!isJoined) {
        actionsHTML = `<button class="btn-action primary" id="joinBtn">Join</button>`;
      } else if (searching) {
        actionsHTML = `<button class="btn-action danger" id="cancelSearchBtn">Cancel</button>`;
      } else {
        actionsHTML = `<button class="btn-action primary" id="findBtn">Find Opponent</button>`;
      }
    }

    // ── Countdown ──
    let countdownHTML = "";
    if (status === "active" && endAt) {
      countdownHTML = `
        <div class="countdown-bar">
          <span class="countdown-label">Time remaining</span>
          <span class="countdown-time" id="countdownEl">—</span>
        </div>
      `;
    }

    // ── Queue status ──
    let queueHTML = "";
    if (status === "active" && isJoined) {
      queueHTML = `<div class="queue-status-bar${searching ? " searching" : ""}" id="arenaQueueStatus" role="status" aria-live="polite">
        ${searching ? "Searching for opponent..." : 'Click "Find Opponent" to play a game'}
      </div>`;
    }

    // ── Body ──
    let bodyHTML = "";
    if (status === "waiting") {
      const playerItems = players.map(p => {
        const username = String(p.username || "Player");
        const initial = username.trim().charAt(0).toUpperCase() || "?";
        return `
        <div class="player-join-item">
          <div class="player-join-avatar" aria-hidden="true">${escapeHTML(initial)}</div>
          <span>${escapeHTML(username)}${p.uid === myUid ? `<span class="lb-you">(You)</span>` : ""}${p.uid === t.createdBy ? `<span class="lb-you">creator</span>` : ""}</span>
        </div>
      `;
      }).join("");
      bodyHTML = `
        <div class="section-title">Players (${count})</div>
        <div class="player-join-list">${playerItems || `<div style="color:var(--muted);font-size:13px;padding:8px 0;">No players yet</div>`}</div>
      `;
    } else {
      bodyHTML = renderLeaderboard(players, status === "active");
    }

    document.getElementById("detailPanel").innerHTML = `
      <div class="detail-header">
        <div>
          <h1 class="detail-title">${escapeHTML(t.name || "Arena")}</h1>
          <div class="detail-badges">
            <span class="status-badge ${status}">${status}</span>
            <span class="detail-badge">${escapeHTML(TC_LABELS[timeControl])}</span>
            <span class="detail-badge">${duration} min</span>
            <span class="detail-badge">${count} player${count !== 1 ? "s" : ""}</span>
          </div>
        </div>
        <div class="detail-actions">${actionsHTML}</div>
      </div>
      ${countdownHTML}
      ${queueHTML}
      ${bodyHTML}
    `;

    // Wire buttons
    document.getElementById("joinBtn")?.addEventListener("click", () => joinTournament(id));
    document.getElementById("leaveBtn")?.addEventListener("click", () => leaveTournament(id));
    document.getElementById("startBtn")?.addEventListener("click", () => startTournament(id, duration));
    document.getElementById("findBtn")?.addEventListener("click", () => findOpponent(id, timeControl));
    document.getElementById("cancelSearchBtn")?.addEventListener("click", () => cancelSearch(id));

    // Countdown ticker
    if (status === "active" && endAt) {
      const el = document.getElementById("countdownEl");
      const tick = () => {
        const rem = Math.max(0, endAt - Date.now());
        const m   = Math.floor(rem / 60000);
        const s   = Math.floor((rem % 60000) / 1000);
        if (el) {
          el.textContent = `${m}:${String(s).padStart(2, "0")}`;
          el.className   = `countdown-time${rem < 60000 ? " low" : ""}`;
        }
        if (rem <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          endTournament(id);
        }
      };
      tick();
      countdownInterval = setInterval(tick, 1000);
    }
  }

  function renderLeaderboard(players, live) {
    if (!players.length) return `<div style="color:var(--muted);font-size:13px;padding:16px 0;">No players yet</div>`;

    const sorted = [...players].sort((a, b) =>
      safeNumber(b.score) - safeNumber(a.score) || safeNumber(b.wins) - safeNumber(a.wins));

    const rows = sorted.map((p, i) => {
      const rank      = i + 1;
      const rankClass = rank === 1 ? "gold" : rank === 2 ? "silver" : rank === 3 ? "bronze" : "";
      const username  = escapeHTML(p.username || "Player");
      return `
        <tr>
          <td class="lb-rank ${rankClass}">#${rank}</td>
          <td>${username}${p.uid === myUid ? `<span class="lb-you">(You)</span>` : ""}</td>
          <td class="lb-score">${safeNumber(p.score)}</td>
          <td class="lb-wdl">${safeNumber(p.wins)}W / ${safeNumber(p.draws)}D / ${safeNumber(p.losses)}L</td>
          <td class="lb-wdl">${safeNumber(p.gamesPlayed)} games</td>
        </tr>
      `;
    }).join("");

    return `
      <div class="section-title">${live ? "Live Leaderboard" : "Final Standings"}</div>
      <div class="leaderboard-scroll">
        <table class="leaderboard" aria-label="${live ? "Live leaderboard" : "Final standings"}">
          <thead><tr><th scope="col">#</th><th scope="col">Player</th><th scope="col">Score</th><th scope="col">W/D/L</th><th scope="col">Games</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  // ── Join ──────────────────────────────────────────────────────────────────
  async function joinTournament(id) {
    await set(ref(db, `tournaments/${id}/players/${myUid}`), {
      username:    myUsername,
      score:       0,
      wins:        0,
      draws:       0,
      losses:      0,
      gamesPlayed: 0,
      joinedAt:    Date.now(),
    });
  }

  // ── Leave ─────────────────────────────────────────────────────────────────
  async function leaveTournament(id) {
    cancelSearch(id);
    await set(ref(db, `tournaments/${id}/players/${myUid}`), null);
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  async function startTournament(id, durationMinutes) {
    const endAt = Date.now() + durationMinutes * 60 * 1000;
    await Promise.all([
      set(ref(db, `tournaments/${id}/status`),  "active"),
      set(ref(db, `tournaments/${id}/startAt`), Date.now()),
      set(ref(db, `tournaments/${id}/endAt`),   endAt),
    ]);
  }

  // ── End (countdown expires) ───────────────────────────────────────────────
  async function endTournament(id) {
    const snap = await get(ref(db, `tournaments/${id}/status`));
    if (snap.val() === "active") await set(ref(db, `tournaments/${id}/status`), "finished");
  }

  // ── Find opponent ─────────────────────────────────────────────────────────
  async function findOpponent(id, tc) {
    if (isSearching) return;
    const tournamentId = safeFirebaseKey(id);
    const callerUid = safeFirebaseKey(myUid);
    if (!tournamentId || !callerUid) {
      setQueueStatus("Unable to start matchmaking. Please refresh and try again.");
      return;
    }
    isSearching = true;

    // Update UI immediately
    const actions = document.querySelector(".detail-actions");
    if (actions) {
      actions.innerHTML = `<button class="btn-action danger" id="cancelSearchBtn">Cancel</button>`;
      document.getElementById("cancelSearchBtn").addEventListener("click", () => cancelSearch(tournamentId));
    }
    setQueueStatus("Searching for opponent...", true);

    try {
      myQueueRef = ref(db, `tournaments/${tournamentId}/queue/${callerUid}`);
      await onDisconnect(myQueueRef).remove();
      await set(myQueueRef, { uid: callerUid, username: String(myUsername || "Player"), joinedAt: Date.now() });

      // Listen before attempting a match so an atomic assignment cannot be missed.
      matchUnsub = onValue(ref(db, `tournaments/${tournamentId}/matches/${callerUid}`), async snap => {
        if (!snap.exists()) return;
        if (matchUnsub) { matchUnsub(); matchUnsub = null; }
        await set(ref(db, `tournaments/${tournamentId}/matches/${callerUid}`), null).catch(() => {});
        isSearching = false;
        window.location.href = `play.html?tournament=${encodeURIComponent(tournamentId)}`;
      });

      void tryMatch(tournamentId, tc);
    } catch (error) {
      console.error("Unable to join the tournament queue", error);
      await recoverSearchUI(tournamentId, "Unable to start matchmaking. Please try again.");
    }
  }

  async function tryMatch(id, tc) {
    const tournamentId = safeFirebaseKey(id);
    const callerUid = safeFirebaseKey(myUid);
    if (!tournamentId || !callerUid) {
      await recoverSearchUI(id, "Unable to start matchmaking. Please refresh and try again.");
      return;
    }

    let committedMatch = null;

    try {
      const result = await runTransaction(ref(db, `tournaments/${tournamentId}/queue`), queue => {
        // Firebase may rerun this callback after a conflict. Keep only the
        // candidate chosen by the latest transaction attempt.
        committedMatch = null;
        if (!queue || typeof queue !== "object") return;
        if (!Object.prototype.hasOwnProperty.call(queue, callerUid)) return;

        const ownEntry = queue[callerUid];
        if (!ownEntry || typeof ownEntry !== "object" || safeFirebaseKey(ownEntry.uid) !== callerUid) return;

        const entries = Object.entries(queue)
          .map(([key, entry]) => ({ uid: safeFirebaseKey(key), entry }))
          .filter(candidate =>
            candidate.uid
            && candidate.uid !== callerUid
            && candidate.entry
            && typeof candidate.entry === "object"
            && safeFirebaseKey(candidate.entry.uid) === candidate.uid);
        if (entries.length === 0) return queue;
        entries.sort((a, b) =>
          safeNumber(a.entry.joinedAt) - safeNumber(b.entry.joinedAt));

        const attemptMatch = entries[0];
        committedMatch = {
          uid: attemptMatch.uid,
          username: String(attemptMatch.entry.username || "Player"),
        };
        const nextQueue = { ...queue };
        delete nextQueue[callerUid];
        delete nextQueue[committedMatch.uid];
        return nextQueue;
      }, { applyLocally: false });

      if (!result.committed || !committedMatch) return;

      try {
        await createTournamentGame(
          tournamentId,
          safeTimeControl(tc),
          callerUid,
          myUsername,
          committedMatch.uid,
          committedMatch.username,
        );
      } catch (error) {
        console.error("Unable to create tournament game", error);
        const requeued = await requeuePlayers(tournamentId, [
          { uid: callerUid, username: myUsername },
          committedMatch,
        ]);
        if (requeued) {
          setQueueStatus("Match setup failed. You are still queued.", true);
        } else {
          await recoverSearchUI(tournamentId, "Match setup failed. Please try again.");
        }
      }
    } catch (error) {
      console.error("Tournament queue transaction failed", error);
      await recoverSearchUI(tournamentId, "Matchmaking was interrupted. Please try again.");
    }
  }

  async function createTournamentGame(tournamentId, tc, whiteUid, whiteUsername, blackUid, blackUsername) {
    const safeTournamentId = safeFirebaseKey(tournamentId);
    const safeWhiteUid = safeFirebaseKey(whiteUid);
    const safeBlackUid = safeFirebaseKey(blackUid);
    if (!safeTournamentId || !safeWhiteUid || !safeBlackUid || safeWhiteUid === safeBlackUid) {
      throw new Error("invalid_match_participant");
    }

    const gameRef = push(ref(db, "games"));
    const gameId  = safeFirebaseKey(gameRef.key);
    if (!gameId) throw new Error("invalid_game_id");
    const secs    = TC_SECS[tc] ?? 600;
    const createdAt = Date.now();
    const clockMs = secs * 1000;

    await update(ref(db), {
      [`games/${gameId}`]: {
        white:        { uid: safeWhiteUid, username: String(whiteUsername || "Player") },
        black:        { uid: safeBlackUid, username: String(blackUsername || "Player") },
        fen:          "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
        moves:        [],
        status:       "playing",
        timeControl:  safeTimeControl(tc),
        whiteTime:    secs,
        blackTime:    secs,
        whiteTimeMs:  clockMs,
        blackTimeMs:  clockMs,
        activeColor:  "white",
        clockUpdatedAt: createdAt,
        createdAt,
        tournamentId: safeTournamentId,
      },
      [`users/${safeWhiteUid}/currentGame`]: gameId,
      [`users/${safeBlackUid}/currentGame`]: gameId,
      [`tournaments/${safeTournamentId}/matches/${safeWhiteUid}`]: gameId,
      [`tournaments/${safeTournamentId}/matches/${safeBlackUid}`]: gameId,
    });
  }

  async function requeuePlayers(tournamentId, players) {
    const safeTournamentId = safeFirebaseKey(tournamentId);
    if (!safeTournamentId) return false;

    const joinedAt = Date.now();
    const rootUpdates = {};
    for (const player of players) {
      const uid = safeFirebaseKey(player?.uid);
      if (!uid) return false;
      rootUpdates[`tournaments/${safeTournamentId}/queue/${uid}`] = {
        uid,
        username: String(player.username || "Player"),
        joinedAt,
      };
    }

    try {
      await update(ref(db), rootUpdates);
      return true;
    } catch {
      return false;
    }
  }

  function setQueueStatus(message, searching = false) {
    const status = document.getElementById("arenaQueueStatus");
    if (!status) return;
    status.textContent = message;
    status.className = `queue-status-bar${searching ? " searching" : ""}`;
  }

  async function recoverSearchUI(id, message) {
    isSearching = false;
    const queueRef = myQueueRef;
    myQueueRef = null;
    if (queueRef) await remove(queueRef).catch(() => {});
    if (matchUnsub) { matchUnsub(); matchUnsub = null; }

    const tournamentId = safeFirebaseKey(id);
    if (!tournamentId) return;
    const snap = await get(ref(db, `tournaments/${tournamentId}`)).catch(() => null);
    if (snap?.val()) renderDetail(tournamentId, snap.val());
    setQueueStatus(message);
  }

  // ── Cancel search ─────────────────────────────────────────────────────────
  function cancelSearch(id) {
    isSearching = false;
    if (myQueueRef) { remove(myQueueRef); myQueueRef = null; }
    if (matchUnsub) { matchUnsub(); matchUnsub = null; }
    // Refresh detail
    get(ref(db, `tournaments/${id}`)).then(snap => { if (snap.val()) renderDetail(id, snap.val()); });
  }

  // ── Create modal ──────────────────────────────────────────────────────────
  const createBtn = document.getElementById("createBtn");
  const createModal = document.getElementById("createModal");
  const createForm = document.getElementById("createForm");

  function openCreateModal() {
    document.getElementById("createError").textContent = "";
    createModal.classList.remove("hidden");
    createModal.setAttribute("aria-hidden", "false");
    requestAnimationFrame(() => document.getElementById("tName").focus());
  }

  function closeCreateModal() {
    createModal.classList.add("hidden");
    createModal.setAttribute("aria-hidden", "true");
    createBtn.focus();
  }

  createBtn.addEventListener("click", openCreateModal);
  document.getElementById("createCancelBtn").addEventListener("click", closeCreateModal);

  createModal.addEventListener("click", event => {
    if (event.target === event.currentTarget) closeCreateModal();
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !createModal.classList.contains("hidden")) {
      event.preventDefault();
      closeCreateModal();
    }
  });

  createForm.addEventListener("submit", async event => {
    event.preventDefault();
    const name     = document.getElementById("tName").value.trim();
    const tc       = safeTimeControl(document.getElementById("tTc").value);
    const duration = safeNumber(document.getElementById("tDuration").value, 30) || 30;
    const errorEl = document.getElementById("createError");
    errorEl.textContent = "";
    if (!name) {
      document.getElementById("tName").focus();
      return;
    }

    const btn = document.getElementById("createSubmitBtn");
    btn.disabled    = true;
    btn.textContent = "Creating...";

    try {
      const tRef = push(ref(db, "tournaments"));
      const tournamentId = safeFirebaseKey(tRef.key);
      const creatorUid = safeFirebaseKey(myUid);
      if (!tournamentId || !creatorUid) throw new Error("invalid_tournament_owner");
      const createdAt = Date.now();
      const creatorUsername = String(myUsername || "Player");

      await update(ref(db), {
        [`tournaments/${tournamentId}`]: {
          name,
          timeControl:     tc,
          durationMinutes: duration,
          status:          "waiting",
          createdBy:       creatorUid,
          creatorUsername,
          createdAt,
          startAt:         null,
          endAt:           null,
          players: {
            [creatorUid]: {
              username:    creatorUsername,
              score:       0,
              wins:        0,
              draws:       0,
              losses:      0,
              gamesPlayed: 0,
              joinedAt:    createdAt,
            },
          },
        },
      });

      document.getElementById("tName").value = "";
      closeCreateModal();
      selectTournament(tournamentId);
    } catch (error) {
      console.error("Unable to create tournament", error);
      errorEl.textContent = "Could not create the tournament. Please try again.";
    } finally {
      btn.disabled    = false;
      btn.textContent = "Create";
    }
  });
</script>
