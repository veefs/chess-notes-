<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaithChess — Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  main { padding: 0; }

  .arena-wrap {
    display: flex;
    min-height: calc(100vh - 64px);
  }

  /* ── List panel ── */
  .arena-list-panel {
    width: 300px;
    flex-shrink: 0;
    background: linear-gradient(180deg, var(--bg2), var(--bg3));
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .arena-list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .arena-list-title { font-size: 16px; font-weight: 700; color: var(--text2); }

  .btn-create {
    padding: 7px 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-create:hover { opacity: .85; }

  .tournament-list {
    overflow-y: auto;
    flex: 1;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .t-card {
    padding: 12px 14px;
    background: var(--bg4);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .t-card:hover, .t-card.selected { border-color: var(--accent); background: rgba(165,148,192,.08); }
  .t-card-name  { font-size: 14px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
  .t-card-meta  { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .t-card-info  { font-size: 11px; color: var(--muted); }

  .status-badge {
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    padding: 2px 7px; border-radius: 20px; text-transform: uppercase;
  }
  .status-badge.waiting  { background: rgba(165,148,192,.15); color: var(--accent); border: 1px solid rgba(165,148,192,.3); }
  .status-badge.active   { background: rgba(76,175,125,.15);  color: #4caf7d;       border: 1px solid rgba(76,175,125,.3); }
  .status-badge.finished { background: rgba(99,95,88,.15);    color: var(--muted);  border: 1px solid var(--border); }

  /* ── Detail panel ── */
  .arena-detail-panel {
    flex: 1;
    overflow-y: auto;
    padding: 32px 36px;
  }

  .detail-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 400px;
    color: var(--muted);
    gap: 12px;
  }
  .detail-placeholder-icon { font-size: 48px; }
  .detail-placeholder-text { font-size: 14px; }

  .detail-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
  }

  .detail-title  { font-size: 26px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
  .detail-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .detail-badge  {
    font-size: 11px; color: var(--muted);
    background: var(--bg4); border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 20px;
  }

  .detail-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-action {
    padding: 10px 20px;
    border: none; border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn-action:hover          { opacity: .85; }
  .btn-action:active         { transform: scale(.97); }
  .btn-action:disabled       { opacity: .4; cursor: not-allowed; }
  .btn-action.primary        { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-action.danger         { background: rgba(224,92,92,.15); color: #e05c5c; border: 1px solid rgba(224,92,92,.3); }
  .btn-action.secondary      { background: var(--bg4); color: var(--text2); border: 1px solid var(--border); }
  .btn-action.success        { background: rgba(76,175,125,.15); color: #4caf7d; border: 1px solid rgba(76,175,125,.3); }

  /* ── Countdown ── */
  .countdown-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .countdown-label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .countdown-time  { font-size: 22px; font-weight: 700; color: var(--text2); font-variant-numeric: tabular-nums; }
  .countdown-time.low { color: #e05c5c; }

  /* ── Queue status ── */
  .queue-status-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .queue-status-bar.searching {
    color: #4caf7d;
    border-color: rgba(76,175,125,.3);
    background: rgba(76,175,125,.06);
    animation: pulse-text 1.5s infinite;
  }
  @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  /* ── Player join list ── */
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px;
  }

  .player-join-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
  .player-join-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    background: var(--bg4); border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; color: var(--text2);
  }
  .player-join-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
  }

  /* ── Leaderboard ── */
  .leaderboard { width: 100%; border-collapse: collapse; }
  .leaderboard th {
    text-align: left; font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .7px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  .leaderboard td {
    padding: 10px 12px; font-size: 13px; color: var(--text2);
    border-bottom: 1px solid rgba(255,255,255,.03);
  }
  .leaderboard tr:hover td { background: rgba(255,255,255,.02); }
  .lb-rank         { font-weight: 700; color: var(--muted); width: 40px; }
  .lb-rank.gold    { color: #f0c040; }
  .lb-rank.silver  { color: #aaaaaa; }
  .lb-rank.bronze  { color: #d4956a; }
  .lb-score        { font-weight: 700; color: var(--accent); font-size: 15px; }
  .lb-you          { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .lb-wdl          { color: var(--muted); font-size: 12px; }

  /* ── Create modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.hidden { display: none; }

  .modal-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 32px;
    min-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .modal-title    { font-size: 18px; font-weight: 700; color: var(--text2); }

  .form-group     { display: flex; flex-direction: column; gap: 6px; }
  .form-label     { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .form-input, .form-select {
    padding: 10px 12px;
    background: var(--bg4); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text2);
    font-family: 'Outfit', sans-serif; font-size: 14px;
    outline: none; transition: border-color .15s;
  }
  .form-input:focus, .form-select:focus { border-color: var(--accent); }
  .form-select option { background: var(--bg3); }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .empty-list { text-align: center; color: var(--muted); font-size: 13px; padding: 32px 16px; }
</style>
</head>
<body>
<header></header>

<main>
  <div class="arena-wrap">

    <!-- Left: tournament list -->
    <div class="arena-list-panel">
      <div class="arena-list-header">
        <span class="arena-list-title">♟ Arena</span>
        <button class="btn-create" id="createBtn">+ Create</button>
      </div>
      <div class="tournament-list" id="tournamentList">
        <div class="empty-list">Loading...</div>
      </div>
    </div>

    <!-- Right: detail -->
    <div class="arena-detail-panel" id="detailPanel">
      <div class="detail-placeholder">
        <div class="detail-placeholder-icon">♟</div>
        <div class="detail-placeholder-text">Select a tournament to view details</div>
      </div>
    </div>

  </div>
</main>

<!-- Create modal -->
<div class="modal-overlay hidden" id="createModal">
  <div class="modal-box">
    <div class="modal-title">Create Arena Tournament</div>
    <div class="form-group">
      <label class="form-label">Name</label>
      <input class="form-input" id="tName" placeholder="e.g. Sunday Blitz Arena" maxlength="40" />
    </div>
    <div class="form-group">
      <label class="form-label">Time Control</label>
      <select class="form-select" id="tTc">
        <option value="bullet">Bullet (1+0)</option>
        <option value="blitz" selected>Blitz (5+0)</option>
        <option value="rapid">Rapid (10+0)</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Duration</label>
      <select class="form-select" id="tDuration">
        <option value="15">15 minutes</option>
        <option value="30" selected>30 minutes</option>
        <option value="60">1 hour</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-action secondary" id="createCancelBtn">Cancel</button>
      <button class="btn-action primary"   id="createSubmitBtn">Create</button>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="challenges.js"></script>
<script src="settings.js"></script>

<script type="module">
  import { getDatabase, ref, get, set, update, push, onValue, runTransaction, remove, onDisconnect }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { initializeApp, getApps }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAUdXVlmN9xhhIzubK0MTtGO3hA9JkHClA",
    authDomain: "faithchess.firebaseapp.com",
    databaseURL: "https://faithchess-default-rtdb.firebaseio.com",
    projectId: "faithchess",
    storageBucket: "faithchess.firebasestorage.app",
    messagingSenderId: "132292001988",
    appId: "1:132292001988:web:3c9b7227f1b09766b48991"
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const auth = getAuth(app);

  const TC_LABELS = { bullet: "Bullet · 1+0", blitz: "Blitz · 5+0", rapid: "Rapid · 10+0" };
  const TC_SECS   = { bullet: 60, blitz: 300, rapid: 600 };
  const TOURNAMENT_STATUSES = new Set(["waiting", "active", "finished"]);
  const START_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    })[char]);
  }

  function safeUsername(value) {
    const username = typeof value === "string" ? value.trim() : "";
    return username ? username.slice(0, 64) : "Unknown";
  }

  function safeInteger(value, fallback = 0, min = 0, max = 200000) {
    const number = Number(value);
    if (!Number.isFinite(number)) return fallback;
    return Math.min(max, Math.max(min, Math.trunc(number)));
  }

  function normalizeTimeControl(value) {
    return Object.hasOwn(TC_LABELS, value) ? value : null;
  }

  function normalizeTournamentStatus(value) {
    return TOURNAMENT_STATUSES.has(value) ? value : "finished";
  }

  let myUid      = null;
  let myUsername = null;

  let selectedId       = null;
  let detailUnsub      = null;
  let countdownInterval = null;
  let myQueueRef       = null;
  let myQueueDisconnect = null;
  let isSearching      = false;
  let matchUnsub       = null;
  let matchAttempt      = null;
  let searchGeneration  = 0;
  let creatingGameId    = null;
  let handlingAssignment = false;

  // ── Auth ──────────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "login.html"; return; }
    const snap = await get(ref(db, `users/${user.uid}/username`));
    myUid      = user.uid;
    myUsername = snap.val() || user.email;
    loadList();
  });

  // ── Tournament list ───────────────────────────────────────────────────────
  function loadList() {
    onValue(ref(db, "tournaments"), snap => {
      const listEl = document.getElementById("tournamentList");
      const data   = snap.val();

      if (!data) {
        listEl.innerHTML = `<div class="empty-list">No tournaments yet.<br>Create one to get started!</div>`;
        return;
      }

      const ORDER = { active: 0, waiting: 1, finished: 2 };
      const items  = Object.entries(data)
        .filter(([, t]) => t && typeof t === "object")
        .map(([id, t]) => ({ id, ...t }))
        .sort((a, b) => (ORDER[a.status] ?? 3) - (ORDER[b.status] ?? 3)
                     || safeInteger(b.createdAt, 0, 0, Number.MAX_SAFE_INTEGER)
                      - safeInteger(a.createdAt, 0, 0, Number.MAX_SAFE_INTEGER));

      listEl.innerHTML = "";
      for (const t of items) {
        const count = t.players ? Object.keys(t.players).length : 0;
        const status = normalizeTournamentStatus(t.status);
        const tc = normalizeTimeControl(t.timeControl);
        const duration = safeInteger(t.durationMinutes, 0, 0, 1440);
        const card  = document.createElement("div");
        card.className  = `t-card${t.id === selectedId ? " selected" : ""}`;
        card.dataset.id = t.id;
        card.innerHTML  = `
          <div class="t-card-name">${escapeHtml(t.name || "Arena")}</div>
          <div class="t-card-meta">
            <span class="status-badge ${status}">${status}</span>
            <span class="t-card-info">${escapeHtml(tc ? TC_LABELS[tc] : "Unknown time control")} · ${duration}min · ${count}p</span>
          </div>
        `;
        card.onclick = () => selectTournament(t.id);
        listEl.appendChild(card);
      }
    });
  }

  // ── Select ────────────────────────────────────────────────────────────────
  function selectTournament(id) {
    if (detailUnsub) { detailUnsub(); detailUnsub = null; }
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

    selectedId = id;
    document.querySelectorAll(".t-card").forEach(c =>
      c.classList.toggle("selected", c.dataset.id === id));

    detailUnsub = onValue(ref(db, `tournaments/${id}`), snap => {
      const t = snap.val();
      if (t) renderDetail(id, t);
    });
  }

  // ── Render detail ─────────────────────────────────────────────────────────
  function renderDetail(id, t) {
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

    const players    = t.players ? Object.entries(t.players).map(([uid, p]) => ({
      uid,
      ...(p && typeof p === "object" ? p : {}),
    })) : [];
    const tournamentStatus = normalizeTournamentStatus(t.status);
    const timeControl = normalizeTimeControl(t.timeControl);
    const durationMinutes = safeInteger(t.durationMinutes, 0, 0, 1440);
    const endAt = safeInteger(t.endAt, 0, 0, Number.MAX_SAFE_INTEGER);
    const isJoined   = players.some(p => p.uid === myUid);
    const isCreator  = t.createdBy === myUid;
    const count      = players.length;
    const searching  = isSearching && selectedId === id;

    // ── Actions ──
    let actionsHTML = "";
    if (tournamentStatus === "waiting") {
      if (!isJoined) {
        actionsHTML = `<button class="btn-action primary" id="joinBtn">Join</button>`;
      } else if (isCreator) {
        actionsHTML = `
          <button class="btn-action success" id="startBtn">Start</button>
          <button class="btn-action danger"  id="leaveBtn">Leave</button>
        `;
      } else {
        actionsHTML = `<button class="btn-action danger" id="leaveBtn">Leave</button>`;
      }
    } else if (tournamentStatus === "active") {
      if (!isJoined) {
        actionsHTML = `<button class="btn-action primary" id="joinBtn">Join</button>`;
      } else if (searching) {
        actionsHTML = `<button class="btn-action danger" id="cancelSearchBtn">Cancel</button>`;
      } else {
        actionsHTML = `<button class="btn-action primary" id="findBtn">Find Opponent</button>`;
      }
    }

    // ── Countdown ──
    let countdownHTML = "";
    if (tournamentStatus === "active" && endAt) {
      countdownHTML = `
        <div class="countdown-bar">
          <span class="countdown-label">Time remaining</span>
          <span class="countdown-time" id="countdownEl">—</span>
        </div>
      `;
    }

    // ── Queue status ──
    let queueHTML = "";
    if (tournamentStatus === "active" && isJoined) {
      queueHTML = `<div class="queue-status-bar${searching ? " searching" : ""}" id="arenaQueueStatus">
        ${searching ? "Searching for opponent..." : 'Click "Find Opponent" to play a game'}
      </div>`;
    }

    // ── Body ──
    let bodyHTML = "";
    if (tournamentStatus === "waiting") {
      const playerItems = players.map(p => {
        const username = safeUsername(p.username);
        return `
          <div class="player-join-item">
            <div class="player-join-avatar">${escapeHtml(username[0].toUpperCase())}</div>
            <span>${escapeHtml(username)}${p.uid === myUid ? `<span class="lb-you">(You)</span>` : ""}${p.uid === t.createdBy ? `<span class="lb-you">creator</span>` : ""}</span>
          </div>
        `;
      }).join("");
      bodyHTML = `
        <div class="section-title">Players (${count})</div>
        <div class="player-join-list">${playerItems || `<div style="color:var(--muted);font-size:13px;padding:8px 0;">No players yet</div>`}</div>
      `;
    } else {
      bodyHTML = renderLeaderboard(players, tournamentStatus === "active");
    }

    document.getElementById("detailPanel").innerHTML = `
      <div class="detail-header">
        <div>
          <div class="detail-title">${escapeHtml(t.name || "Arena")}</div>
          <div class="detail-badges">
            <span class="status-badge ${tournamentStatus}">${tournamentStatus}</span>
            <span class="detail-badge">${escapeHtml(timeControl ? TC_LABELS[timeControl] : "Unknown time control")}</span>
            <span class="detail-badge">${durationMinutes} min</span>
            <span class="detail-badge">${count} player${count !== 1 ? "s" : ""}</span>
          </div>
        </div>
        <div class="detail-actions">${actionsHTML}</div>
      </div>
      ${countdownHTML}
      ${queueHTML}
      ${bodyHTML}
    `;

    // Wire buttons
    document.getElementById("joinBtn")?.addEventListener("click", () => joinTournament(id));
    document.getElementById("leaveBtn")?.addEventListener(
      "click",
      () => leaveTournament(id, isCreator),
    );
    document.getElementById("startBtn")?.addEventListener("click", () => startTournament(id, durationMinutes));
    document.getElementById("findBtn")?.addEventListener("click", () => findOpponent(id, timeControl));
    document.getElementById("cancelSearchBtn")?.addEventListener("click", () => cancelSearch(id));

    // Countdown ticker
    if (tournamentStatus === "active" && endAt) {
      const el = document.getElementById("countdownEl");
      const tick = () => {
        const rem = Math.max(0, endAt - Date.now());
        const m   = Math.floor(rem / 60000);
        const s   = Math.floor((rem % 60000) / 1000);
        if (el) {
          el.textContent = `${m}:${String(s).padStart(2, "0")}`;
          el.className   = `countdown-time${rem < 60000 ? " low" : ""}`;
        }
        if (rem <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          endTournament(id);
        }
      };
      tick();
      countdownInterval = setInterval(tick, 1000);
    }
  }

  function renderLeaderboard(players, live) {
    if (!players.length) return `<div style="color:var(--muted);font-size:13px;padding:16px 0;">No players yet</div>`;

    const sorted = [...players].sort((a, b) =>
      (b.score || 0) - (a.score || 0) || (b.wins || 0) - (a.wins || 0));

    const rows = sorted.map((p, i) => {
      const rank      = i + 1;
      const rankClass = rank === 1 ? "gold" : rank === 2 ? "silver" : rank === 3 ? "bronze" : "";
      const username  = safeUsername(p.username);
      const score     = safeInteger(p.score);
      const wins      = safeInteger(p.wins);
      const draws     = safeInteger(p.draws);
      const losses    = safeInteger(p.losses);
      const games     = safeInteger(p.gamesPlayed);
      return `
        <tr>
          <td class="lb-rank ${rankClass}">#${rank}</td>
          <td>${escapeHtml(username)}${p.uid === myUid ? `<span class="lb-you">(You)</span>` : ""}</td>
          <td class="lb-score">${score}</td>
          <td class="lb-wdl">${wins}W / ${draws}D / ${losses}L</td>
          <td class="lb-wdl">${games} games</td>
        </tr>
      `;
    }).join("");

    return `
      <div class="section-title">${live ? "Live Leaderboard" : "Final Standings"}</div>
      <table class="leaderboard">
        <thead><tr><th>#</th><th>Player</th><th>Score</th><th>W/D/L</th><th>Games</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  // ── Join ──────────────────────────────────────────────────────────────────
  async function joinTournament(id) {
    await set(ref(db, `tournaments/${id}/players/${myUid}`), {
      username:    myUsername,
      score:       0,
      wins:        0,
      draws:       0,
      losses:      0,
      gamesPlayed: 0,
      joinedAt:    Date.now(),
    });
  }

  // ── Leave ─────────────────────────────────────────────────────────────────
  async function leaveTournament(id, isCreator = false) {
    await cancelSearch(id);
    if (isCreator) {
      await remove(ref(db, `tournaments/${id}`));
      selectedId = null;
      document.getElementById("detailPanel").innerHTML =
        `<div class="empty-detail">Select a tournament to view details</div>`;
      return;
    }
    await set(ref(db, `tournaments/${id}/players/${myUid}`), null);
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  async function startTournament(id, durationMinutes) {
    const duration = safeInteger(durationMinutes, 0, 1, 1440);
    if (!duration) return;
    const startAt = Date.now();
    await update(ref(db, `tournaments/${id}`), {
      status: "active",
      startAt,
      endAt: startAt + duration * 60 * 1000,
    });
  }

  // ── End (countdown expires) ───────────────────────────────────────────────
  async function endTournament(id) {
    const snap = await get(ref(db, `tournaments/${id}/status`));
    if (snap.val() === "active") await set(ref(db, `tournaments/${id}/status`), "finished");
  }

  // ── Find opponent ─────────────────────────────────────────────────────────
  function queueCore(entry) {
    return {
      uid: entry.uid,
      username: entry.username,
      joinedAt: entry.joinedAt,
      tc: entry.tc,
    };
  }

  function openQueueEntry(entry) {
    return { ...queueCore(entry), state: "open" };
  }

  function hasExactKeys(value, expectedKeys) {
    if (!value || typeof value !== "object" || Array.isArray(value)) return false;
    const actual = Object.keys(value).sort();
    const expected = [...expectedKeys].sort();
    return actual.length === expected.length && actual.every((key, index) => key === expected[index]);
  }

  function isOpenQueueEntry(value, uid, tc) {
    return hasExactKeys(value, ["uid", "username", "joinedAt", "tc", "state"])
      && value.uid === uid
      && typeof value.username === "string"
      && Number.isFinite(value.joinedAt)
      && value.tc === tc
      && value.state === "open";
  }

  function isFreshQueueTimestamp(value, referenceTime = Date.now()) {
    return Number.isFinite(value)
      && value >= referenceTime - 300000
      && value <= referenceTime + 300000;
  }

  function sameQueueEntry(current, expected) {
    if (!current || !expected || typeof current !== "object" || typeof expected !== "object") return false;
    const currentKeys = Object.keys(current).sort();
    const expectedKeys = Object.keys(expected).sort();
    return currentKeys.length === expectedKeys.length
      && currentKeys.every((key, index) =>
        key === expectedKeys[index] && current[key] === expected[key]);
  }

  async function transitionQueueEntry(entryRef, expected, nextValue) {
    const result = await runTransaction(entryRef, current =>
      sameQueueEntry(current, expected) ? nextValue : undefined, { applyLocally: false });
    return result.committed;
  }

  function candidatePrecedesMe(candidate, mine) {
    return candidate.joinedAt < mine.joinedAt
      || (candidate.joinedAt === mine.joinedAt && candidate.uid < mine.uid);
  }

  function setQueueStatus(message, searching = true) {
    const status = document.getElementById("arenaQueueStatus");
    if (!status) return;
    status.textContent = message;
    status.className = `queue-status-bar${searching ? " searching" : ""}`;
  }

  async function cancelQueueDisconnect() {
    const registration = myQueueDisconnect;
    myQueueDisconnect = null;
    if (!registration) return;
    try {
      await registration.cancel();
    } catch (error) {
      console.warn("Could not cancel queue disconnect cleanup", error);
    }
  }

  function listenForTournamentMatch(tournamentId) {
    if (matchUnsub) matchUnsub();
    matchUnsub = onValue(ref(db, `tournaments/${tournamentId}/matches/${myUid}`), snap => {
      const gameId = snap.val();
      if (typeof gameId !== "string" || !/^[A-Za-z0-9_-]{8,128}$/.test(gameId)) return;
      if (creatingGameId === gameId) return;
      void handleAssignedMatch(tournamentId, gameId);
    });
  }

  async function handleAssignedMatch(tournamentId, gameId) {
    if (handlingAssignment) return;
    handlingAssignment = true;
    let shouldNavigate = false;
    try {
      const currentGameSnap = await get(ref(db, `users/${myUid}/currentGame`));
      if (currentGameSnap.val() !== gameId) {
        await set(ref(db, `tournaments/${tournamentId}/matches/${myUid}`), null);
        return;
      }

      searchGeneration += 1;
      isSearching = false;
      await cancelQueueDisconnect();
      if (myQueueRef) {
        await runTransaction(myQueueRef, current => {
          if (!current || current.uid !== myUid || current.gameId !== gameId) return;
          return null;
        }, { applyLocally: false });
      }
      await set(ref(db, `tournaments/${tournamentId}/matches/${myUid}`), null);
      shouldNavigate = true;
    } catch (error) {
      console.warn("Matched, but local queue cleanup was incomplete", error);
    } finally {
      handlingAssignment = false;
      if (shouldNavigate) {
        myQueueRef = null;
        if (matchUnsub) { matchUnsub(); matchUnsub = null; }
        window.location.href = `play.html?tournament=${encodeURIComponent(tournamentId)}`;
      }
    }
  }

  async function findOpponent(id, rawTimeControl) {
    if (isSearching) return;
    const tc = normalizeTimeControl(rawTimeControl);
    if (!tc || !myUid || typeof myUsername !== "string") return;

    const generation = ++searchGeneration;
    const myEntry = {
      uid: myUid,
      username: myUsername,
      joinedAt: Date.now(),
      tc,
      state: "open",
    };
    isSearching = true;

    const actions = document.querySelector(".detail-actions");
    if (actions) {
      actions.innerHTML = `<button class="btn-action danger" id="cancelSearchBtn">Cancel</button>`;
      document.getElementById("cancelSearchBtn").addEventListener("click", () => void cancelSearch(id));
    }
    setQueueStatus("Searching for opponent...");

    myQueueRef = ref(db, `tournaments/${id}/queue/${myUid}`);
    let attempt = null;
    try {
      myQueueDisconnect = onDisconnect(myQueueRef);
      await myQueueDisconnect.remove();
      await runTransaction(myQueueRef, current => {
        if (!current) return null;
        return current.uid === myUid ? null : undefined;
      }, { applyLocally: false });
      await set(myQueueRef, myEntry);
      if (generation !== searchGeneration) {
        await transitionQueueEntry(myQueueRef, myEntry, null);
        return;
      }

      listenForTournamentMatch(id);
      attempt = tryMatch(id, tc, myEntry, generation);
      matchAttempt = attempt;
      await attempt;
    } catch (error) {
      console.error("Tournament matchmaking failed", error);
      if (generation === searchGeneration) {
        searchGeneration += 1;
        isSearching = false;
        await cancelQueueDisconnect();
        if (myQueueRef) {
          try {
            await transitionQueueEntry(myQueueRef, myEntry, null);
          } catch (cleanupError) {
            console.warn("Could not roll back open queue entry", cleanupError);
          }
        }
        if (matchUnsub) { matchUnsub(); matchUnsub = null; }
        setQueueStatus("Matchmaking failed. Try again.", false);
      }
    } finally {
      if (matchAttempt === attempt) matchAttempt = null;
    }
  }

  async function rollbackClaim(targetRef, targetClaim, callerRef, callerClaim) {
    try {
      await transitionQueueEntry(targetRef, targetClaim, openQueueEntry(targetClaim));
    } catch (error) {
      console.warn("Could not roll back target queue claim", error);
    }
    try {
      await transitionQueueEntry(callerRef, callerClaim, openQueueEntry(callerClaim));
    } catch (error) {
      console.warn("Could not roll back caller queue claim", error);
    }
  }

  async function tryMatch(tournamentId, tc, myEntry, generation) {
    const queueSnap = await get(ref(db, `tournaments/${tournamentId}/queue`));
    const queue = queueSnap.val() || {};
    const queueWindowNow = Date.now();
    if (!isFreshQueueTimestamp(myEntry.joinedAt, queueWindowNow)) return false;
    const candidates = Object.entries(queue)
      .filter(([uid, entry]) =>
        uid !== myUid
        && isOpenQueueEntry(entry, uid, tc)
        && isFreshQueueTimestamp(entry.joinedAt, queueWindowNow)
        && candidatePrecedesMe(entry, myEntry))
      .map(([uid, entry]) => ({ uid, entry }))
      .sort((a, b) =>
        a.entry.joinedAt - b.entry.joinedAt
        || (a.uid < b.uid ? -1 : a.uid > b.uid ? 1 : 0));

    for (const candidate of candidates) {
      if (generation !== searchGeneration) return false;

      const gameRef = push(ref(db, "games"));
      const gameId = gameRef.key;
      const callerClaim = {
        ...queueCore(myEntry),
        state: "claiming",
        peerUid: candidate.uid,
        gameId,
        stateAt: Date.now(),
      };
      const callerClaimed = await transitionQueueEntry(myQueueRef, myEntry, callerClaim);
      if (!callerClaimed) return false;

      if (generation !== searchGeneration) {
        try {
          await transitionQueueEntry(myQueueRef, callerClaim, myEntry);
        } catch (error) {
          console.warn("Could not cancel caller queue claim", error);
        }
        return false;
      }

      const targetRef = ref(db, `tournaments/${tournamentId}/queue/${candidate.uid}`);
      const targetClaim = {
        ...queueCore(candidate.entry),
        state: "claimed",
        peerUid: myUid,
        gameId,
        stateAt: Date.now(),
      };
      let targetClaimed = false;
      try {
        targetClaimed = await transitionQueueEntry(targetRef, candidate.entry, targetClaim);
      } catch (error) {
        try {
          await transitionQueueEntry(myQueueRef, callerClaim, myEntry);
        } catch (rollbackError) {
          console.warn("Could not restore caller after target claim error", rollbackError);
        }
        throw error;
      }
      if (!targetClaimed) {
        const callerRestored = await transitionQueueEntry(myQueueRef, callerClaim, myEntry);
        if (!callerRestored) return false;
        continue;
      }

      if (generation !== searchGeneration) {
        await rollbackClaim(targetRef, targetClaim, myQueueRef, callerClaim);
        return false;
      }

      creatingGameId = gameId;
      try {
        await createTournamentGame(
          tournamentId,
          tc,
          gameRef,
          myEntry,
          candidate.entry,
          myQueueRef,
          callerClaim,
          targetRef,
          targetClaim,
        );
        return true;
      } catch (error) {
        await rollbackClaim(targetRef, targetClaim, myQueueRef, callerClaim);
        throw error;
      } finally {
        creatingGameId = null;
      }
    }
    return false;
  }

  async function createTournamentGame(
    tournamentId,
    tc,
    gameRef,
    whiteEntry,
    blackEntry,
    callerRef,
    callerClaim,
    targetRef,
    targetClaim,
  ) {
    const gameId = gameRef.key;
    const secs = TC_SECS[tc];
    let gameWritten = false;
    let assignmentsWritten = false;

    try {
      await set(gameRef, {
        schemaVersion: 2,
        kind: "tournament",
        white: { uid: whiteEntry.uid, username: whiteEntry.username },
        black: { uid: blackEntry.uid, username: blackEntry.username },
        status: "playing",
        timeControl: tc,
        createdAt: Date.now(),
        createdBy: whiteEntry.uid,
        tournamentId,
        position: {
          ply: 0,
          turnUid: whiteEntry.uid,
          fen: START_FEN,
        },
        clocks: {
          white: secs,
          black: secs,
        },
      });
      gameWritten = true;

      await update(ref(db), {
        [`users/${whiteEntry.uid}/currentGame`]: gameId,
        [`users/${blackEntry.uid}/currentGame`]: gameId,
        [`tournaments/${tournamentId}/matches/${whiteEntry.uid}`]: gameId,
        [`tournaments/${tournamentId}/matches/${blackEntry.uid}`]: gameId,
      });
      assignmentsWritten = true;
    } catch (error) {
      if (gameWritten && !assignmentsWritten) {
        try {
          await remove(gameRef);
        } catch (rollbackError) {
          console.error("Could not remove an unassigned tournament game", rollbackError);
        }
      }
      throw error;
    }

    try {
      await transitionQueueEntry(targetRef, targetClaim, null);
      await transitionQueueEntry(callerRef, callerClaim, null);
    } catch (error) {
      console.warn("Game created, but queue cleanup was incomplete", error);
    }

    searchGeneration += 1;
    isSearching = false;
    await cancelQueueDisconnect();
    if (matchUnsub) { matchUnsub(); matchUnsub = null; }
    try {
      await set(ref(db, `tournaments/${tournamentId}/matches/${whiteEntry.uid}`), null);
    } catch (error) {
      console.warn("Could not clear local match notification", error);
    }
    myQueueRef = null;
    window.location.href = `play.html?tournament=${encodeURIComponent(tournamentId)}`;
  }

  // ── Cancel search ─────────────────────────────────────────────────────────
  async function cancelSearch(id) {
    searchGeneration += 1;
    isSearching = false;
    const pendingAttempt = matchAttempt;
    matchAttempt = null;
    if (pendingAttempt) {
      try {
        await pendingAttempt;
      } catch (error) {
        console.warn("Match attempt ended during cancellation", error);
      }
    }

    await cancelQueueDisconnect();
    if (myQueueRef) {
      try {
        await runTransaction(myQueueRef, current => {
          if (!current || current.uid !== myUid) return;
          return null;
        }, { applyLocally: false });
      } catch (error) {
        console.warn("Could not remove own queue entry", error);
      }
      myQueueRef = null;
    }
    if (matchUnsub) { matchUnsub(); matchUnsub = null; }

    try {
      const snap = await get(ref(db, `tournaments/${id}`));
      if (snap.val()) renderDetail(id, snap.val());
    } catch (error) {
      console.warn("Could not refresh tournament detail", error);
    }
  }

  // ── Create modal ──────────────────────────────────────────────────────────
  document.getElementById("createBtn").onclick = () =>
    document.getElementById("createModal").classList.remove("hidden");

  document.getElementById("createCancelBtn").onclick = () =>
    document.getElementById("createModal").classList.add("hidden");

  document.getElementById("createModal").onclick = e => {
    if (e.target === e.currentTarget) document.getElementById("createModal").classList.add("hidden");
  };

  document.getElementById("createSubmitBtn").onclick = async () => {
    const name     = document.getElementById("tName").value.trim();
    const tc       = normalizeTimeControl(document.getElementById("tTc").value);
    const duration = safeInteger(document.getElementById("tDuration").value, 0, 1, 1440);
    if (!name || name.length > 80 || !tc || !duration) {
      document.getElementById("tName").focus();
      return;
    }

    const btn = document.getElementById("createSubmitBtn");
    btn.disabled    = true;
    btn.textContent = "Creating...";

    const tRef = push(ref(db, "tournaments"));
    const createdAt = Date.now();
    const creatorPlayer = {
      username:    myUsername,
      score:       0,
      wins:        0,
      draws:       0,
      losses:      0,
      gamesPlayed: 0,
      joinedAt:    createdAt,
    };

    try {
      await update(tRef, {
        name,
        timeControl:     tc,
        durationMinutes: duration,
        status:          "waiting",
        createdBy:       myUid,
        creatorUsername: myUsername,
        createdAt,
        [`players/${myUid}`]: creatorPlayer,
      });

      document.getElementById("createModal").classList.add("hidden");
      document.getElementById("tName").value = "";
      selectTournament(tRef.key);
    } catch (error) {
      console.error("Could not create tournament", error);
    } finally {
      btn.disabled    = false;
      btn.textContent = "Create";
    }
  };
</script>
</body>
