<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaithChess — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header></header>

<main>
  <div class="auth-wrap">
    <div class="auth-box">
      <h2 class="auth-title">Create account</h2>
      <p class="auth-sub">Join FaithChess and start playing</p>
      <div class="auth-field">
        <label>Username</label>
        <input type="text" id="usernameInput" placeholder="your username" maxlength="24" />
      </div>
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="emailInput" placeholder="you@example.com" />
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="min. 6 characters" />
      </div>
      <div id="authError" class="auth-error hidden"></div>
      <button class="auth-btn" id="signupBtn">Create Account</button>
      <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
    </div>
  </div>
</main>

<script src="nav.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, deleteUser } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, get, runTransaction, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAUdXVlmN9xhhIzubK0MTtGO3hA9JkHClA",
    authDomain: "faithchess.firebaseapp.com",
    databaseURL: "https://faithchess-default-rtdb.firebaseio.com",
    projectId: "faithchess",
    storageBucket: "faithchess.firebasestorage.app",
    messagingSenderId: "132292001988",
    appId: "1:132292001988:web:3c9b7227f1b09766b48991"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  document.getElementById("signupBtn").onclick = async () => {
    const username = document.getElementById("usernameInput").value.trim();
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    const errEl = document.getElementById("authError");

    errEl.classList.add("hidden");
    errEl.textContent = "";

    if (!username) { errEl.textContent = "Please enter a username."; errEl.classList.remove("hidden"); return; }
    if (username.length < 3) { errEl.textContent = "Username must be at least 3 characters."; errEl.classList.remove("hidden"); return; }
    if (!/^[A-Za-z0-9_-]{3,24}$/.test(username)) {
      errEl.textContent = "Use 3–24 letters, numbers, underscores, or hyphens.";
      errEl.classList.remove("hidden");
      return;
    }

    const usernameSnap = await get(ref(db, `usernames/${username.toLowerCase()}`));
    if (usernameSnap.exists()) { errEl.textContent = "Username already taken."; errEl.classList.remove("hidden"); return; }

    let cred = null;
    let usernameClaimed = false;
    const usernameKey = username.toLowerCase();
    const usernameRef = ref(db, `usernames/${usernameKey}`);
    try {
      cred = await createUserWithEmailAndPassword(auth, email, password);
      const uid = cred.user.uid;
      const claim = await runTransaction(
        usernameRef,
        current => current === null ? uid : undefined,
        { applyLocally: false },
      );
      if (!claim.committed || claim.snapshot.val() !== uid) {
        const conflict = new Error("Username already taken.");
        conflict.code = "profile/username-taken";
        throw conflict;
      }
      usernameClaimed = true;

      await update(ref(db, `users/${uid}`), {
        username,
        email,
        rating: 1200,
        wins: 0,
        losses: 0,
        draws: 0,
        createdAt: Date.now(),
      });

      window.location.href = "index.html";
    } catch (err) {
      if (usernameClaimed && cred?.user) {
        await runTransaction(
          usernameRef,
          current => current === cred.user.uid ? null : current,
          { applyLocally: false },
        ).catch(() => {});
      }
      if (cred?.user) {
        await deleteUser(cred.user).catch(() => {});
      }
      errEl.textContent = friendlyError(err.code);
      errEl.classList.remove("hidden");
    }
  };

  function friendlyError(code) {
    if (code === "auth/email-already-in-use") return "An account with that email already exists.";
    if (code === "auth/invalid-email") return "Invalid email address.";
    if (code === "auth/weak-password") return "Password must be at least 6 characters.";
    if (code === "profile/username-taken") return "Username already taken.";
    return "Something went wrong. Please try again.";
  }
</script>

</body>
</html>
